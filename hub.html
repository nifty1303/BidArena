<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>Tournament hub · BidArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-sport="football" class="hub-page">
  <main class="wrap hub-wrap">
    <div class="topbar"><span id="brandSlot"></span><span class="row" style="gap:8px" id="topActions"></span></div>
    <section id="hub"><div class="card" style="padding:28px;text-align:center"><p class="lead">Loading the tournament…</p></div></section>
  </main>

  <script type="module">
    import {
      db, ref, onValue, update, set, get, copyText, currentUser, ensureGuest, isHostAccount, signInHost,
      safe, crestHTML, loadTeamLogos, logoOf, brandHTML, refreshTourLogo, squadGroupsHTML, catList, catColour, catInk,
      positionOf, confirmBox, alertBox, applySportTheme, setPageBackground, loadBanners, newId, money
    } from "./app.js";

    document.getElementById("brandSlot").innerHTML = brandHTML("Tournament hub");
    const $ = id => document.getElementById(id);
    const root = $("hub");
    let code = (new URLSearchParams(location.search).get("a") || "").toUpperCase();
    // short links: /t/<name> (or ?t=<name>) point at an auction's hub
    const slugFromUrl = (location.pathname.match(/^\/t\/([a-z0-9-]+)\/?$/i) || [])[1] || new URLSearchParams(location.search).get("t") || "";
    const SITE = location.origin;
    const shortLink = () => H().slug ? `${SITE}/t/${H().slug}` : `${SITE}/hub.html?a=${code}`;
    const slugify = t => String(t || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30).replace(/-+$/, "");
    let A = null, user = null, manage = false, matchFilter = "upcoming", openTeam = null;
    const logos = {}, bannerCache = {};
    let bannerKey = null;
    const TABS = [["home", "Overview"], ["matches", "Matches"], ["table", "Table"], ["stats", "Stats"], ["teams", "Teams"]];
    let tab = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : "home";

    const STAGES = { league: "League", group: "Group stage", qf: "Quarter-final", sf: "Semi-final", third: "Third place", final: "Final", friendly: "Friendly" };
    const isKO = st => ["qf", "sf", "third", "final"].includes(st);

    // ---------- data ----------
    const H = () => (A && A.hub) || {};
    const HS = () => ({ win: 3, draw: 1, loss: 0, qualify: 0, pens: false, penWin: 2, penLoss: 1, ...(H().settings || {}) });
    // league draws settled by a shootout (when the tournament plays it that way)
    const pensWin = f => { const p = f.pens; if (!p) return null; if (p.h != null && p.a != null && p.h !== p.a) return p.h > p.a ? "h" : "a"; return p.win === "h" || p.win === "a" ? p.win : null; };
    const shootout = f => { const s = scoreOf(f); return s.h === s.a ? pensWin(f) : null; };
    const pensText = f => { const w = shootout(f); if (!w) return ""; const p = f.pens; return p.h != null && p.a != null ? `pens ${p.h}–${p.a}` : `${team(w === "h" ? f.home : f.away).name} won on pens`; };
    const pensFor = f => true;                       // every draw can go to a shootout (optional)
    const teams = () => Object.entries((A && A.teams) || {});
    // Placeholders for matches whose teams aren't known yet: "rank:1" (league position) or "tbd"
    const isPh = id => typeof id === "string" && (id === "tbd" || id.startsWith("rank:"));
    const phName = id => id === "tbd" ? "To be decided" : `Rank ${id.slice(5)}`;
    const team = id => isPh(id) ? { name: phName(id), color: "#8895A0", ph: true } : ((A && A.teams) || {})[id] || { name: "TBD", color: "#8895A0", ph: true };
    const crest = (id, size = "") => isPh(id) ? `<span class="crest ph-crest ${size}">${id === "tbd" ? "?" : "#" + id.slice(5)}</span>` : crestHTML(team(id), logoOf(logos, id), size);
    const byTime = (a, b) => (a.at || 9e15) - (b.at || 9e15) || (a.round || 0) - (b.round || 0) || (a.order || 0) - (b.order || 0);
    const rawFixtures = () => Object.entries(H().fixtures || {}).map(([id, f]) => ({ id, ...f })).sort(byTime);
    // "Rank 1" becomes the real team once every league match has a result
    function leagueFinal() {
      const L = rawFixtures().filter(f => (f.stage || "league") === "league");
      return L.length && L.every(f => f.status === "done") ? standings() : null;
    }
    const fixtures = () => {
      const fin = rawFixtures().some(f => isPh(f.home) || isPh(f.away)) ? leagueFinal() : null;
      const res = id => { if (!fin || !String(id).startsWith("rank:")) return id; const r = fin[+id.slice(5) - 1]; return r ? r.id : id; };
      return rawFixtures().map(f => ({ ...f, rawHome: f.home, rawAway: f.away, home: res(f.home), away: res(f.away) }));
    };
    const teamsSet = f => !isPh(f.home) && !isPh(f.away);
    const otherSide = (f, tid) => tid === f.home ? f.away : f.home;
    const evSide = (f, e) => e.type === "og" ? otherSide(f, e.team) : e.team;     // an own goal sits with the team it counted for
    // cards are tight: one name per player (skip prefixes like Md/Mohammed; keep Sr/Jr so namesakes stay apart)
    const NAME_PREFIX = /^(md\.?|mohd\.?|mohammad|mohammed|muhammad|mohamed|sk\.?|sheikh|shaikh|syed|sayed|mr\.?|dr\.?)$/i;
    const shortName = n => {
      const w = String(n || "").trim().split(/\s+/).filter(Boolean);
      const suffix = w.length > 1 && /^(sr|jr|snr|jnr)\.?$/i.test(w[w.length - 1]) ? " " + w.pop() : "";
      const core = w.length > 1 ? w.filter(x => !NAME_PREFIX.test(x)) : w;
      return (core[0] || w[0] || "") + suffix;
    };
    const ogMini = e => `<i class="og-tag" style="--oc:${safe(team(e.team).color)}" title="Own goal by a ${safe(team(e.team).name)} player">OG</i>`;
    const ogTag = e => `<i class="og-tag" style="--oc:${safe(team(e.team).color)}">OG · ${safe(team(e.team).name)}</i>`;
    // Match officials: editable until the match is marked Full time, then locked
    const OFFICIALS = [["ref", "Referee"], ["l1", "Linesman 1"], ["l2", "Linesman 2"]];
    const offLocked = f => !!f && f.status === "done";
    const officialsHTML = f => { const o = (f && f.officials) || {}; return OFFICIALS.filter(([k]) => o[k]).length
      ? `<div class="hm-officials"><span>🧑‍⚖️ Referee <b>${safe(o.ref || "–")}</b></span>${o.l1 || o.l2 ? `<span>🚩 Linesmen <b>${safe([o.l1, o.l2].filter(Boolean).join(", "))}</b></span>` : ""}</div>` : ""; };
    const officialInputs = (f, pre) => `<div class="hub-fgrid off-grid">${OFFICIALS.map(([k, l]) => `<label>${l}<input class="input" id="${pre}${k}" maxlength="40" value="${safe(((f && f.officials) || {})[k] || "")}" ${offLocked(f) ? "disabled" : ""} placeholder="${k === "ref" ? "Name" : "Name (optional)"}"></label>`).join("")}</div>
      ${offLocked(f) ? `<p class="hint" style="margin:4px 0 0">🔒 Locked because the match has ended. Switch it back from Full time to change.</p>` : ""}`;
    const readOfficials = (box, pre) => { const o = {}; OFFICIALS.forEach(([k]) => { const v = box.querySelector("#" + pre + k).value.trim().slice(0, 40); if (v) o[k] = v; }); return Object.keys(o).length ? o : null; };
    const squadIds = tid => Object.entries((A && A.players) || {}).filter(([, p]) => p.status === "sold" && p.soldTo === tid)
      .sort((a, b) => catList(A.settings).findIndex(c => c.id === a[1].cat) - catList(A.settings).findIndex(c => c.id === b[1].cat) || String(a[1].name).localeCompare(String(b[1].name)));
    const pname = (pid, ev) => (pid && A.players && A.players[pid] ? A.players[pid].name : (ev && ev.n) || "Unknown");
    // goals first, then cards; each in minute order (no minute goes last)
    const isGoalEv = e => e.type === "goal" || e.type === "pen" || e.type === "og";
    const byMinute = (a, b) => (a.min || 999) - (b.min || 999) || (a.at || 0) - (b.at || 0);
    const goalsThenCards = list => [...list.filter(isGoalEv).sort(byMinute), ...list.filter(e => !isGoalEv(e)).sort(byMinute)];
    const evList = f => Object.entries(f.events || {}).map(([id, e]) => ({ id, ...e })).sort((a, b) => (a.min || 0) - (b.min || 0) || (a.at || 0) - (b.at || 0));
    function scoreOf(f) {
      let h = 0, a = 0;
      evList(f).forEach(e => {
        if (e.type === "goal" || e.type === "pen") { if (e.team === f.home) h++; else if (e.team === f.away) a++; }
        if (e.type === "og") { if (e.team === f.home) a++; else if (e.team === f.away) h++; }   // an own goal counts for the other side
      });
      return { h: f.hs != null ? f.hs : h, a: f.as != null ? f.as : a, eh: h, ea: a };   // the main score wins; scorers are extra detail
    }
    const played = f => f.status === "done";
    const hasScore = f => f.status === "done" || f.status === "live";
    function winnerOf(f) {
      if (!played(f)) return null;
      const { h, a } = scoreOf(f);
      if (h !== a) return h > a ? f.home : f.away;
      if (shootout(f)) return shootout(f) === "h" ? f.home : f.away;
      return null;
    }

    function standings() {
      const P = HS(), rows = {};
      teams().forEach(([id]) => { rows[id] = { id, p: 0, w: 0, d: 0, l: 0, pw: 0, pl: 0, gf: 0, ga: 0, pts: 0, form: [] }; });
      rawFixtures().filter(f => played(f) && (f.stage || "league") === "league" && rows[f.home] && rows[f.away]).forEach(f => {
        const { h, a } = scoreOf(f), H_ = rows[f.home], W = rows[f.away];
        H_.p++; W.p++; H_.gf += h; H_.ga += a; W.gf += a; W.ga += h;
        if (h > a) { H_.w++; W.l++; H_.pts += P.win; W.pts += P.loss; H_.form.push("W"); W.form.push("L"); }
        else if (h < a) { W.w++; H_.l++; W.pts += P.win; H_.pts += P.loss; W.form.push("W"); H_.form.push("L"); }
        else if (shootout(f)) {                                 // drawn, then won on penalties
          const [win, lose] = shootout(f) === "h" ? [H_, W] : [W, H_];
          win.pw++; lose.pl++; win.pts += +P.penWin || 0; lose.pts += +P.penLoss || 0; win.form.push("PW"); lose.form.push("PL");
        }
        else { H_.d++; W.d++; H_.pts += P.draw; W.pts += P.draw; H_.form.push("D"); W.form.push("D"); }
      });
      return Object.values(rows).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || String(team(x.id).name).localeCompare(team(y.id).name));
    }

    function playerStats() {
      const S = {};
      const get = (pid, ev) => { const k = pid || "n:" + (ev.n || "?") + ":" + ev.team; return S[k] || (S[k] = { key: k, pid, name: pname(pid, ev), team: pid && A.players[pid] ? A.players[pid].soldTo || ev.team : ev.team, goals: 0, assists: 0, yellow: 0, red: 0, motm: 0, apps: 0 }); };
      fixtures().filter(hasScore).forEach(f => {
        evList(f).forEach(e => {
          if ((e.type === "goal" || e.type === "pen") && (e.pid || e.n)) get(e.pid, e).goals++;
          if ((e.type === "goal" || e.type === "pen") && e.assist) get(e.assist, { team: e.team }).assists++;
          if (e.type === "yellow" && (e.pid || e.n)) get(e.pid, e).yellow++;
          if (e.type === "red" && (e.pid || e.n)) get(e.pid, e).red++;
        });
        if (played(f) && f.motm) get(f.motm, { team: (A.players[f.motm] || {}).soldTo }).motm++;
      });
      return Object.values(S);
    }

    // ---------- time ----------
    const fmtDay = ms => new Date(ms).toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
    const fmtShort = ms => new Date(ms).toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
    const fmtTime = ms => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const dayKey = ms => { const d = new Date(ms); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
    function when(ms) {
      if (!ms) return "Date to be decided";
      const d0 = new Date(); d0.setHours(0, 0, 0, 0);
      const days = Math.round((new Date(ms).setHours(0, 0, 0, 0) - d0) / 864e5);
      const day = days === 0 ? "Today" : days === 1 ? "Tomorrow" : days === -1 ? "Yesterday" : fmtShort(ms);
      return `${day} · ${fmtTime(ms)}`;
    }
    const toInput = ms => ms ? new Date(ms - new Date(ms).getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "";
    const fromInput = v => v ? new Date(v).getTime() : 0;

    // ---------- writing ----------
    const fRef = id => ref(db, `auctions/${code}/hub/fixtures/${id}`);
    const save = (id, patch) => update(fRef(id), patch).catch(e => alertBox("Couldn't save", e.message || String(e), "⚠️"));
    const isStaff = () => !!(user && isHostAccount(user) && A && (A.owner === user.uid || (A.editors || {})[user.uid]));

    // ============================================================
    // Page
    // ============================================================
    function render() {
      if (!A) return;
      if (A.status !== "ended") return renderLocked();
      document.title = `${A.title || "Tournament"} · Tournament hub`;
      const live = fixtures().filter(f => f.status === "live");
      const P = fixtures().filter(played).length, N = fixtures().length;
      const prevScroll = scrollY;
      root.innerHTML = `
        <header class="hub-hero">
          <div class="hub-hero-in">
            <span class="tour-logo hub-logo" data-tour-logo hidden></span>
            <div class="hub-hero-txt">
              <p class="hub-eyebrow">${live.length ? `<span class="hub-live-dot"></span> ${live.length} match${live.length > 1 ? "es" : ""} live now` : "Tournament hub"}</p>
              <h1>${safe(A.title || "Tournament")}</h1>
              <p class="hub-sub">${teams().length} teams · ${N ? `${P}/${N} matches played` : "Fixtures coming soon"}</p>
            </div>
          </div>
          <nav class="hub-tabs" role="tablist">${TABS.map(([id, label]) => `<button type="button" role="tab" class="${tab === id ? "on" : ""}" data-tab="${id}" aria-selected="${tab === id}">${label}</button>`).join("")}</nav>
        </header>
        ${isStaff() ? `<div class="hub-manage-bar ${manage ? "on" : ""}">
            <label class="hub-switch"><input type="checkbox" id="manageTgl" ${manage ? "checked" : ""}><span></span> Manage mode</label>
            ${manage ? `<div class="row" style="gap:8px;flex-wrap:wrap">
                <button class="btn btn-sun btn-sm" data-act="add">＋ Add match</button>
                <button class="btn btn-light btn-sm" data-act="gen">⚡ Generate fixtures</button>
                <button class="btn btn-light btn-sm" data-act="settings">⚙ Points & table</button></div>`
              : `<span class="muted" style="font-size:13px">Turn on to add matches and enter results. Everyone else sees updates instantly.</span>`}
          </div>` : ""}
        <div id="hubBody" class="hub-body">${body()}</div>`;
      scrollTo(0, prevScroll);
      const shareBtn = `<button class="btn btn-sun btn-sm" id="shareBtn">🔗 Share</button>`;
      if (!isStaff()) $("topActions").innerHTML = shareBtn + (user && isHostAccount(user) ? "" : `<button class="link-btn" id="orgIn" style="font-size:13px">Organiser? Sign in</button>`);
      else $("topActions").innerHTML = shareBtn + `<a class="btn btn-light btn-sm" href="room.html?a=${code}">Auction results</a>`;
      $("shareBtn").onclick = shareHub;
      $("orgIn") && ($("orgIn").onclick = async () => { try { user = await signInHost(); render(); } catch (e) {} });
    }

    function renderLocked() {
      root.innerHTML = `<div class="card hub-locked">
          <span class="tour-logo showcase-logo" data-tour-logo hidden></span>
          <div class="hub-lock-ico">🏆</div>
          <h1 class="title" style="font-size:clamp(30px,5vw,46px)">Tournament hub <span>opens soon</span></h1>
          <p class="lead">${safe(A.title || "This tournament")}'s hub opens once the player auction is finished, so every squad is final.</p>
          <div class="row" style="justify-content:center;gap:10px;margin-top:16px">
            ${A.status === "live" ? `<a class="btn btn-sun" href="index.html?a=${code}">Watch the auction live ▶</a>` : ""}
            ${isStaff() ? `<a class="btn btn-light" href="room.html?a=${code}">Open control room</a>` : ""}
          </div></div>`;
    }

    function body() {
      if (tab === "matches") return matchesTab();
      if (tab === "table") return tableTab();
      if (tab === "stats") return statsTab();
      if (tab === "teams") return teamsTab();
      return homeTab();
    }

    // ---------- match card ----------
    // under the teams: officials before kick-off; scorers and cards once it starts
    function cardFoot(f) {
      if (!hasScore(f)) {
        const o = f.officials || {};
        return o.ref || o.l1 || o.l2 ? `<div class="mc-off">${o.ref ? `🧑‍⚖️ ${safe(o.ref)}` : ""}${o.l1 || o.l2 ? `<span>🚩 ${safe([o.l1, o.l2].filter(Boolean).join(", "))}</span>` : ""}</div>` : "";
      }
      const ev = evList(f);
      if (!ev.length) return "";
      const line = tid => {
        const by = {};
        goalsThenCards(ev.filter(e => evSide(f, e) === tid)).forEach(e => {
          const k = (e.type === "yellow" || e.type === "red" || e.type === "og" ? e.type : "g") + ":" + (e.pid || e.n || "?");
          (by[k] = by[k] || { e, mins: [] }).mins.push(e.min ? e.min + "′" + (e.type === "pen" ? " p" : "") : (e.type === "pen" ? "p" : ""));
        });
        return Object.values(by).map(({ e, mins }) => `<span>${e.type === "yellow" ? "🟨" : e.type === "red" ? "🟥" : "⚽"} <span title="${safe(pname(e.pid, e))}">${safe(shortName(pname(e.pid, e)))}</span>${e.type === "og" ? " " + ogMini(e) : ""}${mins.filter(Boolean).length ? ` <small>${mins.filter(Boolean).join(", ")}</small>` : ""}</span>`).join("");
      };
      return `<div class="mc-ev"><div class="h">${line(f.home)}</div><div class="a">${line(f.away)}</div></div>`;
    }
    function matchCard(f, opts = {}) {
      const s = scoreOf(f), live = f.status === "live", done = played(f), win = winnerOf(f);
      const mid = hasScore(f)
        ? `<div class="mc-score ${live ? "live" : ""}"><b>${s.h}</b><i>–</i><b>${s.a}</b></div>
           <div class="mc-state">${live ? `<span class="hub-live-dot"></span>LIVE` : "Full time"}${done && pensText(f) ? ` · ${safe(pensText(f))}` : ""}</div>`
        : `<div class="mc-time">${f.at ? fmtTime(f.at) : "TBD"}</div><div class="mc-state">${f.at ? fmtShort(f.at) : "Date TBD"}</div>`;
      const side = (id, cls) => `<div class="mc-team ${cls} ${isPh(id) ? "ph" : ""} ${done && win && win !== id ? "lost" : ""} ${done && win === id ? "won" : ""}">${crest(id, opts.big ? "lg" : "")}<span>${safe(team(id).name)}</span></div>`;
      return `<article class="mc ${live ? "is-live" : ""} ${opts.big ? "big" : ""}" data-match="${f.id}" tabindex="0">
          <div class="mc-top"><span class="mc-stage ${isKO(f.stage) ? "ko" : ""}">${safe(STAGES[f.stage || "league"] || "Match")}${f.round ? ` · Round ${f.round}` : ""}</span>${f.venue ? `<span class="mc-venue">📍 ${safe(f.venue)}</span>` : ""}</div>
          <div class="mc-row">${side(f.home, "home")}<div class="mc-mid">${mid}</div>${side(f.away, "away")}</div>
          ${cardFoot(f)}
          ${manage ? `<div class="mc-tools">${teamsSet(f) ? "" : `<span class="mc-ph-note">Teams decided later</span>`}<button class="btn btn-sun btn-sm" data-result="${f.id}" ${teamsSet(f) ? "" : "disabled"}>${done ? "Edit result" : live ? "Update live" : "Enter result"}</button><button class="btn btn-light btn-sm" data-edit="${f.id}">Edit</button><button class="icon-btn" data-del="${f.id}" aria-label="Delete match">✕</button></div>` : ""}
        </article>`;
    }

    const empty = (icon, title, text, cta = "") => `<div class="hub-empty"><div>${icon}</div><h3>${title}</h3><p>${text}</p>${cta}</div>`;
    const noFixturesCTA = () => isStaff() ? `<button class="btn btn-sun" data-act="${manage ? "gen" : "manage-gen"}">⚡ Generate fixtures</button>` : "";

    // ---------- Overview ----------
    function homeTab() {
      const F = fixtures();
      if (!F.length) return empty("📅", "No fixtures yet", isStaff() ? "Create the full league schedule in one click, or add matches one by one in Manage mode." : "The organiser hasn't published the fixtures yet. Check back soon.", noFixturesCTA());
      const live = F.filter(f => f.status === "live");
      const next = F.filter(f => f.status !== "done" && f.status !== "live");
      const last = F.filter(played).sort((a, b) => (b.at || 0) - (a.at || 0));
      const table = standings().slice(0, 5), st = playerStats();
      const lead = (arr, k) => arr.filter(x => x[k] > 0).sort((a, b) => b[k] - a[k] || b.goals - a.goals)[0];
      const top = lead(st, "goals"), ast = lead(st, "assists"), mvp = lead(st, "motm");
      const leaderCard = (icon, label, x, k, unit) => `<div class="hub-leader" ${x ? `style="--c:${safe(team(x.team).color)}"` : ""}>
          <span class="hl-ico">${icon}</span><span class="hl-label">${label}</span>
          ${x ? `<b>${safe(x.name)}</b><span class="hl-team">${crest(x.team, "sm")}${safe(team(x.team).name)}</span><span class="hl-num">${x[k]}<small>${unit}</small></span>` : `<b class="muted">Nobody yet</b>`}</div>`;
      return `
        ${live.length ? `<section class="hub-sec"><h2 class="hub-h"><span class="hub-live-dot"></span> Live now</h2><div class="mc-list">${live.map(f => matchCard(f, { big: true })).join("")}</div></section>` : ""}
        <div class="hub-grid2">
          <section class="hub-sec"><h2 class="hub-h">Next up${next.length > 2 ? ` <small class="hub-count">${next.length}</small>` : ""}</h2>${next.length ? `<div class="mc-list scroll">${next.map(f => matchCard(f)).join("")}</div>` : `<p class="muted">No more matches scheduled.</p>`}</section>

    // ---------- Matches ----------
    function matchesTab() {
      const F = fixtures();
      if (!F.length) return empty("📅", "No fixtures yet", isStaff() ? "Generate a full schedule or add matches in Manage mode." : "Fixtures will appear here as soon as they're published.", noFixturesCTA());
      const list = matchFilter === "results" ? F.filter(hasScore).sort((a, b) => (b.at || 0) - (a.at || 0))
        : matchFilter === "upcoming" ? F.filter(f => !played(f)) : F;
      const groups = [];
      list.forEach(f => { const k = f.at ? dayKey(f.at) : "tbd"; let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, at: f.at, items: [] }); g.items.push(f); });
      const counts = { upcoming: F.filter(f => !played(f)).length, results: F.filter(hasScore).length, all: F.length };
      return `<div class="hub-seg">${[["upcoming", "Upcoming"], ["results", "Results"], ["all", "All"]].map(([k, l]) => `<button type="button" class="${matchFilter === k ? "on" : ""}" data-filter="${k}">${l} <small>${counts[k]}</small></button>`).join("")}</div>
        ${groups.length ? groups.map(g => `<section class="hub-day"><h3>${g.at ? fmtDay(g.at) : "Date to be decided"}</h3><div class="mc-list">${g.items.map(f => matchCard(f)).join("")}</div></section>`).join("")
          : `<p class="muted" style="text-align:center;margin:30px 0">${matchFilter === "results" ? "No results yet." : "Nothing left to play. What a season!"}</p>`}`;
    }

    // ---------- Table ----------
    function tableHTML(rows, mini = false) {
      const q = +HS().qualify || 0, pens = true, showD = rows.some(r => r.d);   // PW/PL always shown; D only when a draw had no shootout
      const formI = x => x === "PW" ? `<i class="PW" title="Won on penalties">W</i>` : x === "PL" ? `<i class="PL" title="Lost on penalties">L</i>` : `<i class="${x}">${x}</i>`;
      return `<div class="hub-table-wrap"><table class="hub-table ${mini ? "mini" : ""}">
        <thead><tr><th>#</th><th class="tl">Team</th><th>P</th>${mini ? "" : `<th>W</th>${pens ? `<th title="Won on penalties">PW</th><th title="Lost on penalties">PL</th>` : ""}${showD ? "<th>D</th>" : ""}<th>L</th><th class="hide-sm">GF</th><th class="hide-sm">GA</th>`}<th>GD</th><th>Pts</th>${mini ? "" : `<th class="hide-sm tl">Form</th>`}</tr></thead>
        <tbody>${rows.map((r, i) => `<tr class="${q && i < q ? "q" : ""}" style="--c:${safe(team(r.id).color)}">
          <td class="pos">${i + 1}</td>
          <td class="tl"><span class="tt">${crest(r.id, "sm")}<b>${safe(team(r.id).name)}</b></span></td>
          <td>${r.p}</td>${mini ? "" : `<td>${r.w}</td>${pens ? `<td>${r.pw}</td><td>${r.pl}</td>` : ""}${showD ? `<td>${r.d}</td>` : ""}<td>${r.l}</td><td class="hide-sm">${r.gf}</td><td class="hide-sm">${r.ga}</td>`}
          <td>${r.gf - r.ga > 0 ? "+" : ""}${r.gf - r.ga}</td><td class="pts">${r.pts}</td>
          ${mini ? "" : `<td class="hide-sm tl"><span class="form">${r.form.slice(-5).map(formI).join("") || "<small class='muted'>–</small>"}</span></td>`}</tr>`).join("")}</tbody></table></div>`;
    }
    function tableTab() {
      const P = HS(), q = +P.qualify || 0;
      const ko = fixtures().filter(f => isKO(f.stage));
      return `<section class="hub-sec">${tableHTML(standings())}
          <p class="hub-note"><b>Points:</b> Win ${P.win} · Draw → penalties: winner ${P.penWin}, loser ${P.penLoss} · Loss ${P.loss}${standings().some(r => r.d) ? ` · Draw with no shootout entered ${P.draw}` : ""}. PW / PL = won / lost on penalties (outlined in Form). Ties split by goal difference, then goals scored.${q ? ` <span class="q-key"></span> Top ${q} qualify.` : ""} League matches only.</p></section>
        ${ko.length ? `<section class="hub-sec"><h2 class="hub-h">Knockouts</h2><div class="mc-list">${ko.map(f => matchCard(f)).join("")}</div></section>` : ""}`;

    // ---------- Stats ----------
    function board(title, icon, rows, k, unit, extra = () => "") {
      return `<section class="hub-board"><h3><span>${icon}</span>${title}</h3>
        ${rows.length ? `<ol>${rows.slice(0, 10).map((x, i) => `<li class="${i === 0 ? "first" : ""}" style="--c:${safe(team(x.team).color)}"><span class="rk">${i + 1}</span>${crest(x.team, "sm")}<span class="nm"><b>${safe(x.name)}</b><small>${safe(team(x.team).name)}${extra(x)}</small></span><span class="vl">${typeof k === "function" ? k(x) : x[k]}<small>${unit}</small></span></li>`).join("")}</ol>`
          : `<p class="muted" style="margin:6px 0 2px">Nothing yet</p>`}</section>`;
    }
    function statsTab() {
      const st = playerStats();
      const by = k => st.filter(x => x[k] > 0).sort((a, b) => b[k] - a[k] || b.goals - a.goals || String(a.name).localeCompare(b.name));
      const disc = st.filter(x => x.yellow || x.red).sort((a, b) => (b.red * 3 + b.yellow) - (a.red * 3 + a.yellow));
      const T = standings().map(r => {
        const cs = fixtures().filter(f => played(f) && (f.home === r.id || f.away === r.id)).filter(f => { const s = scoreOf(f); return f.home === r.id ? s.a === 0 : s.h === 0; }).length;

        const gf = all.reduce((n, f) => n + (f.home === r.id ? scoreOf(f).h : scoreOf(f).a), 0), ga = all.reduce((n, f) => n + (f.home === r.id ? scoreOf(f).a : scoreOf(f).h), 0);
        return { id: r.id, n: all.length, gf, ga, cs };

      return `<div class="hub-boards">
          ${board("Top scorers", "⚽", by("goals"), "goals", "", x => x.assists ? ` · ${x.assists} ast` : "")}

          ${board("Player of the match", "⭐", by("motm"), "motm", "")}
          ${board("Discipline", "🟨", disc, x => `${x.yellow ? `<i class="cardc y">${x.yellow}</i>` : ""}${x.red ? `<i class="cardc r">${x.red}</i>` : ""}`, "")}
        </div>
        <section class="hub-sec"><h2 class="hub-h">Team stats</h2>
          <div class="hub-table-wrap"><table class="hub-table"><thead><tr><th class="tl">Team</th><th>Played</th><th>Scored</th><th>Conceded</th><th>Clean sheets</th></tr></thead>
          <tbody>${T.map(r => `<tr style="--c:${safe(team(r.id).color)}"><td class="tl"><span class="tt">${crest(r.id, "sm")}<b>${safe(team(r.id).name)}</b></span></td><td>${r.n}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.cs}</td></tr>`).join("")}</tbody></table></div></section>`;
    }

    // ---------- Teams ----------
    function teamsTab() {
      const rows = standings(), st = playerStats(), s = A.settings || {};
      return `<div class="hub-teams">${teams().map(([id, t]) => {
        const r = rows.find(x => x.id === id) || { p: 0, w: 0, d: 0, l: 0, pts: 0 }, pos = rows.findIndex(x => x.id === id) + 1;
        const best = st.filter(x => x.team === id && x.goals).sort((a, b) => b.goals - a.goals)[0];

    const ordinal = n => n + (["th", "st", "nd", "rd"][((n % 100) - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");

    // ============================================================
    // Match details (everyone)

        back.innerHTML = `<section class="card modal hub-match" style="--hc:${safe(team(g.home).color)};--ac:${safe(team(g.away).color)}">

          <p class="hm-meta">${safe(STAGES[g.stage || "league"] || "Match")}${g.round ? ` · Round ${g.round}` : ""}${g.at ? ` · ${fmtDay(g.at)}, ${fmtTime(g.at)}` : ""}${g.venue ? ` · ${safe(g.venue)}` : ""}</p>
          <div class="hm-board">
            <div class="hm-team">${crest(g.home, "xl")}<b>${safe(team(g.home).name)}</b></div>
            <div class="hm-score">${hasScore(g) ? `<span>${s.h}</span><i>–</i><span>${s.a}</span>` : `<em>${g.at ? fmtTime(g.at) : "TBD"}</em>`}
              <small>${g.status === "live" ? `<span class="hub-live-dot"></span> LIVE` : played(g) ? "Full time" : "Upcoming"}${played(g) && pensText(g) ? ` · ${safe(pensText(g))}` : ""}</small></div>
            <div class="hm-team">${crest(g.away, "xl")}<b>${safe(team(g.away).name)}</b></div>

          ${officialsHTML(g)}
          ${g.motm ? `<div class="hm-motm">⭐ Player of the match <b>${safe(pname(g.motm))}</b> <span>${safe(team((A.players[g.motm] || {}).soldTo).name)}</span></div>` : ""}
          ${g.note ? `<p class="hm-note">${safe(g.note)}</p>` : ""}
          ${isStaff() ? `<div class="row" style="justify-content:center;gap:8px;margin-top:14px"><button class="btn btn-sun btn-sm" data-result="${g.id}">${played(g) ? "Edit result" : "Enter result"}</button><button class="btn btn-light btn-sm" data-edit="${g.id}">Edit match</button></div>` : ""}

      back.addEventListener("click", e => {
        if (e.target === back || e.target.closest(".modal-x")) return back.remove();
        const r = e.target.closest("[data-result]"), ed = e.target.closest("[data-edit]");
        if (r) { back.remove(); openResult(r.dataset.result); }
        if (ed) { back.remove(); editMatch(ed.dataset.edit); }
      });
    }

    // ============================================================
    // Manage: add / edit a match
    // ============================================================
    function form(title, html, onMount) {
      return new Promise(resolve => {
        const back = document.createElement("div");
        back.className = "modal-back";
        back.innerHTML = `<section class="card modal hub-form"><button class="icon-btn modal-x" aria-label="Close">✕</button><h2 class="title" style="font-size:30px">${title}</h2>${html}</section>`;
        document.body.appendChild(back);
        const close = v => { back.remove(); resolve(v); };
        back.addEventListener("click", e => { if (e.target === back || e.target.closest(".modal-x") || e.target.closest("[data-cancel]")) close(null); });
        onMount(back, close);
      });
    }
    const teamOpts = sel => `<optgroup label="Teams">${teams().map(([id, t]) => `<option value="${id}" ${id === sel ? "selected" : ""}>${safe(t.name)}</option>`).join("")}</optgroup>
      <optgroup label="Decide later">${teams().map((_, i) => `<option value="rank:${i + 1}" ${sel === "rank:" + (i + 1) ? "selected" : ""}>Rank ${i + 1} (league position)</option>`).join("")}<option value="tbd" ${sel === "tbd" ? "selected" : ""}>To be decided</option></optgroup>`;
    const stageOpts = sel => Object.entries(STAGES).map(([k, l]) => `<option value="${k}" ${k === (sel || "league") ? "selected" : ""}>${l}</option>`).join("");

    async function editMatch(id) {
      const f = id ? fixtures().find(x => x.id === id) : null;
      if (teams().length < 2) return alertBox("Not enough teams", "You need at least two teams.");
      const T = teams();
      await form(f ? "Edit match" : "Add a match", `
        <div class="hub-fgrid">

          <label>Away team<select class="select" id="mAway">${teamOpts(f ? f.rawAway : T[1][0])}</select></label>
          <label>Date & time<input class="input" type="datetime-local" id="mAt" value="${toInput(f && f.at)}"></label>

          <label>Stage<select class="select" id="mStage">${stageOpts(f && f.stage)}</select></label>
          <label>Round <small class="muted">(optional)</small><input class="input" type="number" min="1" id="mRound" value="${(f && f.round) || ""}"></label>
          <div class="full"><p class="off-title">Match officials</p>${officialInputs(f, "mo_")}</div>
          <label class="full">Note <small class="muted">(optional, shown to everyone)</small><input class="input" id="mNote" maxlength="120" value="${safe((f && f.note) || "")}" placeholder="e.g. Kick-off moved due to rain"></label>
        </div>
        <p class="err" id="mErr"></p>
        <div class="dlg-actions"><button class="btn btn-light" data-cancel>Cancel</button><button class="btn btn-sun" id="mSave">${f ? "Save changes" : "Add match"}</button></div>`,
        (back, close) => {
          back.querySelector("#mSave").onclick = async () => {
            const home = back.querySelector("#mHome").value, away = back.querySelector("#mAway").value;
            if (home === away && home !== "tbd") { back.querySelector("#mErr").textContent = "Pick two different teams."; return; }

              stage: back.querySelector("#mStage").value, round: +back.querySelector("#mRound").value || null, note: back.querySelector("#mNote").value.trim().slice(0, 120) || null,
              ...(offLocked(f) ? {} : { officials: readOfficials(back, "mo_") }) };
            if (f) await save(f.id, data);
            else await set(fRef(newId()), { ...data, status: "scheduled", order: Date.now() });

          };
        });
    }

    // Round robin (circle method): every team plays every other team once (or twice)
    async function generate() {
      const T = teams().map(([id]) => id);
      if (T.length < 2) return alertBox("Not enough teams", "You need at least two teams.");
      const existing = fixtures().filter(f => (f.stage || "league") === "league");
      const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(16, 0, 0, 0);
      await form("Generate fixtures", `
        <p class="hint">Creates a league where every team plays every other team. You can edit any match afterwards.</p>
        <div class="hub-fgrid">
          <label>Format<select class="select" id="gLegs"><option value="1">Single round (play each team once)</option><option value="2">Home & away (play each team twice)</option></select></label>
          <label>First match<input class="input" type="datetime-local" id="gStart" value="${toInput(d.getTime())}"></label>
          <label>Days between rounds<input class="input" type="number" min="0" id="gGap" value="1"></label>
          <label>Minutes between matches on the same day<input class="input" type="number" min="0" id="gSlot" value="60"></label>
          <label class="full">Venue<input class="input" id="gVenue" maxlength="60" placeholder="e.g. KAFCO Ground"></label>
        </div>
        <p class="hint" id="gInfo"></p>
        ${existing.length ? `<label class="hub-check"><input type="checkbox" id="gReplace" checked> Replace the ${existing.filter(f => !hasScore(f)).length} unplayed league matches already scheduled (results are kept)</label>` : ""}
        <div class="dlg-actions"><button class="btn btn-light" data-cancel>Cancel</button><button class="btn btn-sun" id="gGo">Create fixtures</button></div>`,
        (back, close) => {
          const info = () => { const legs = +back.querySelector("#gLegs").value, n = T.length + (T.length % 2); back.querySelector("#gInfo").textContent = `${T.length} teams → ${(T.length * (T.length - 1) / 2) * legs} matches over ${(n - 1) * legs} rounds.`; };
          back.querySelector("#gLegs").onchange = info; info();
          back.querySelector("#gGo").onclick = async () => {
            const legs = +back.querySelector("#gLegs").value, start = fromInput(back.querySelector("#gStart").value);
            const gap = Math.max(0, +back.querySelector("#gGap").value || 0), slot = Math.max(0, +back.querySelector("#gSlot").value || 0), venue = back.querySelector("#gVenue").value.trim().slice(0, 60);
            const list = T.slice(); if (list.length % 2) list.push(null);
            const n = list.length, rounds = [];
            let arr = list.slice();
            for (let r = 0; r < n - 1; r++) {
              const pairs = [];
              for (let i = 0; i < n / 2; i++) { const a = arr[i], b = arr[n - 1 - i]; if (a && b) pairs.push(r % 2 ? [b, a] : [a, b]); }
              rounds.push(pairs);
              arr = [arr[0], arr[n - 1], ...arr.slice(1, n - 1)];
            }
            const all = legs === 2 ? [...rounds, ...rounds.map(p => p.map(([a, b]) => [b, a]))] : rounds;
            const ch = {};
            if (back.querySelector("#gReplace")?.checked) existing.filter(f => !hasScore(f)).forEach(f => { ch[`auctions/${code}/hub/fixtures/${f.id}`] = null; });
            let order = Date.now();
            all.forEach((pairs, r) => pairs.forEach(([home, away], k) => {
              const at = start ? start + r * gap * 864e5 + k * slot * 60000 : 0;
              ch[`auctions/${code}/hub/fixtures/${newId()}`] = { home, away, at, venue, stage: "league", round: r + 1, status: "scheduled", order: order++ };
            }));
            await update(ref(db), ch);
            close(true);
            tab = "matches"; matchFilter = "upcoming"; location.hash = "matches"; render();
          };
        });
    }

    async function settingsForm() {

      await form("Points & table", `

    // ============================================================
    // Manage: results, live. Every change saves at once, so viewers see goals as they happen
    // ============================================================
    let resultBox = null;
    function openResult(id) {
      const f0 = fixtures().find(x => x.id === id);

    }
    function playerOpts(tid, sel = "", blank = "Pick the player") {
      return `<option value="">${blank}</option>${squadIds(tid).map(([pid, p]) => `<option value="${pid}" ${pid === sel ? "selected" : ""}>${safe(p.name)}${positionOf(p, A.settings) ? ` · ${safe(positionOf(p, A.settings))}` : ""}</option>`).join("")}<option value="__other">Someone else (type a name)</option>`;
    }
    function drawResult() {
      if (!resultBox) return;
      const f = fixtures().find(x => x.id === resultBox.id);
      if (!f) { resultBox.back.remove(); resultBox = null; return; }
      const s = scoreOf(f), ev = evList(f), ad = resultBox.adding;
      const P = HS(), league = (f.stage || "league") === "league", sw = shootout(f);
      const pts = !league ? null : s.h > s.a ? [P.win, P.loss] : s.h < s.a ? [P.loss, P.win]
        : sw === "h" ? [P.penWin, P.penLoss] : sw === "a" ? [P.penLoss, P.penWin] : [P.draw, P.draw];
      const scoreBox = (tid, k) => `<div class="sc-side" style="--c:${safe(team(tid).color)}">
          ${crest(tid, "lg")}<b class="sc-name">${safe(team(tid).name)}</b>
          <div class="sc-ctl"><button type="button" class="sc-btn" data-score="${k}:-1" ${s[k] <= 0 ? "disabled" : ""} aria-label="One less">−</button><span class="sc-n">${s[k]}</span><button type="button" class="sc-btn" data-score="${k}:1" aria-label="One more">＋</button></div>
          ${pts ? `<span class="sc-pts">${pts[k === "h" ? 0 : 1]} pt${pts[k === "h" ? 0 : 1] === 1 ? "" : "s"}</span>` : ""}
        </div>`;
      const pensBlock = pensFor(f) && s.h === s.a && hasScore(f) ? `<div class="rs-pens">
          <b>Draw: who won the penalty shootout? <small class="muted" style="font-weight:600">(optional)</small></b>
          <div class="row" style="gap:8px;justify-content:center;flex-wrap:wrap">${[["h", f.home], ["a", f.away]].map(([k, tid]) => `<button type="button" class="btn btn-sm ${sw === k ? "btn-sun" : "btn-light"}" data-penwin="${k}">${sw === k ? "✓ " : ""}${safe(team(tid).name)}</button>`).join("")}</div>
          <small class="muted">Shootout score (optional) <input class="input" type="number" min="0" id="pnH" value="${f.pens && f.pens.h != null ? f.pens.h : ""}" placeholder="${safe(team(f.home).name)}"> – <input class="input" type="number" min="0" id="pnA" value="${f.pens && f.pens.a != null ? f.pens.a : ""}" placeholder="${safe(team(f.away).name)}"></small>
        </div>` : "";
      const side = (tid, key) => `
        <div class="rs-side" style="--c:${safe(team(tid).color)}">
          <div class="rs-head">${crest(tid, "sm")}<b>${safe(team(tid).name)}</b><span class="rs-sub">${(key === "h" ? s.eh : s.ea)} of ${(key === "h" ? s.h : s.a)} goals named</span></div>
          <ul class="rs-evs">${goalsThenCards(ev.filter(e => evSide(f, e) === tid)).map(e => `<li class="${e.type === "og" ? "og" : ""}" ${e.type === "og" ? `style="--oc:${safe(team(e.team).color)}"` : ""}>${evIcon(e.type)} <span><b>${safe(pname(e.pid, e))}</b>${e.type === "pen" ? " (pen)" : e.type === "og" ? " " + ogTag(e) : ""}${e.assist ? ` <small>· assist ${safe(pname(e.assist))}</small>` : ""}</span><em>${e.min ? e.min + "′" : ""}</em><button class="icon-btn" data-rmev="${e.id}" aria-label="Remove">✕</button></li>`).join("") || `<li class="muted" style="justify-content:center">Nothing yet</li>`}</ul>
          ${ad && ad.team === tid ? `<div class="rs-add">
              <div class="hub-fgrid">
                <label>${ad.kind === "goal" ? (ad.type === "og" ? `Own goal by (${safe(team(otherSide(f, tid)).name)})` : "Scorer") : "Player"}<select class="select" id="adP">${playerOpts(ad.type === "og" ? otherSide(f, tid) : tid, ad.pid || "")}</select></label>
                ${ad.pid === "__other" ? `<label>Name<input class="input" id="adN" maxlength="24"></label>` : ""}
                <label>${ad.kind === "goal" ? "Type" : "Card"}<select class="select" id="adT">${ad.kind === "goal" ? [["goal", "Goal"], ["pen", "Penalty"], ["og", `Own goal (by ${safe(team(otherSide(f, tid)).name)})`]].map(([v, l]) => `<option value="${v}" ${(ad.type || "goal") === v ? "selected" : ""}>${l}</option>`).join("") : `<option value="yellow">🟨 Yellow</option><option value="red">🟥 Red</option>`}</select></label>
                <label>Minute<input class="input" type="number" min="1" max="130" id="adM" placeholder="e.g. 23"></label>
                ${ad.kind === "goal" && ad.type !== "og" ? `<label>Assist <small class="muted">(optional)</small><select class="select" id="adA">${playerOpts(tid, "", "No assist").replace(/<option value="__other">.*?<\/option>/, "")}</select></label>` : ""}
              </div>
              <div class="row" style="gap:8px;justify-content:flex-end"><button class="btn btn-light btn-sm" data-addcancel>Cancel</button><button class="btn btn-sun btn-sm" data-addsave>Add ${ad.kind === "goal" ? "goal" : "card"}</button></div>
            </div>` : `<div class="row" style="gap:8px"><button class="btn btn-sun btn-sm grow" data-addgoal="${tid}">＋ Goal</button><button class="btn btn-light btn-sm grow" data-addcard="${tid}">＋ Card</button></div>`}
        </div>`;
      const motmOpts = `<option value="">Not chosen</option>${[f.home, f.away].map(tid => `<optgroup label="${safe(team(tid).name)}">${squadIds(tid).map(([pid, p]) => `<option value="${pid}" ${pid === f.motm ? "selected" : ""}>${safe(p.name)}</option>`).join("")}</optgroup>`).join("")}`;
      const keep = resultBox.back.querySelector(".hub-result") ? resultBox.back.querySelector(".hub-result").scrollTop : 0;
      resultBox.back.innerHTML = `<section class="card modal hub-result">
          <button class="icon-btn modal-x" aria-label="Close">✕</button>
          <p class="hm-meta">${safe(STAGES[f.stage || "league"])}${f.round ? ` · Round ${f.round}` : ""}${f.at ? ` · ${fmtShort(f.at)}, ${fmtTime(f.at)}` : ""}</p>
          <div class="hub-seg rs-status">${[["scheduled", "Not started"], ["live", "🔴 Live"], ["done", "Full time"]].map(([k, l]) => `<button type="button" class="${(f.status || "scheduled") === k ? "on" : ""}" data-status="${k}">${l}</button>`).join("")}</div>
          <div class="sc-board">${scoreBox(f.home, "h")}<span class="sc-dash">–</span>${scoreBox(f.away, "a")}</div>
          ${pensBlock}
          ${league && hasScore(f) && s.h === s.a && !sw ? `<p class="hint" style="text-align:center;margin:6px 0 0">Drawn: pick who won the shootout to give ${P.penWin} and ${P.penLoss} pts, or leave it as a draw (${P.draw} each).</p>` : ""}
          <details class="rs-more" ${ev.length || resultBox.adding || resultBox.open ? "open" : ""}><summary>Scorers & cards <small>(optional)</small></summary>
            <div class="rs-grid">${side(f.home, "h")}${side(f.away, "a")}</div>
          </details>
          <label class="rs-motm">⭐ Player of the match<select class="select" id="rsMotm">${motmOpts}</select></label>
          <div class="rs-off"><p class="off-title">Match officials</p>${officialInputs(f, "ro_")}</div>
          <p class="hint" style="text-align:center;margin-top:12px">Every change is saved instantly and shows on everyone's screen.</p>
          <div class="dlg-actions"><button class="btn btn-sun" data-done>Done</button></div>
        </section>`;
      resultBox.back.querySelector(".hub-result").scrollTop = keep;
    }
    async function onResultClick(e) {
      const rb = resultBox; if (!rb) return;
      const f = fixtures().find(x => x.id === rb.id);
      if (e.target === rb.back || e.target.closest(".modal-x") || e.target.closest("[data-done]")) { rb.back.remove(); resultBox = null; return; }
      const st = e.target.closest("[data-status]");
      if (st) {
        const v = st.dataset.status;
        if (v === "done" && !f.motm && squadIds(f.home).length) { /* fine: MOTM is optional */ }
        await save(f.id, { status: v, ...(v === "live" && !f.startedAt ? { startedAt: Date.now() } : {}) });
        return;
      }
      const sc = e.target.closest("[data-score]");
      if (sc) {
        const [k, d] = sc.dataset.score.split(":"), s = scoreOf(f), v = Math.max(0, s[k] + +d);
        const patch = { hs: s.h, as: s.a, [k === "h" ? "hs" : "as"]: v };
        if ((f.status || "scheduled") === "scheduled") patch.status = "live";
        await save(f.id, patch);
        return;
      }
      const pw = e.target.closest("[data-penwin]");
      if (pw) { const k = pw.dataset.penwin; await save(f.id, { pens: shootout(f) === k && !(f.pens && f.pens.h != null) ? null : { win: k } }); return; }   // tap again to clear
      if (e.target.closest(".rs-more summary")) { rb.open = !rb.back.querySelector(".rs-more").open; return; }
      if (e.target.closest("[data-addgoal]")) { rb.adding = { kind: "goal", team: e.target.closest("[data-addgoal]").dataset.addgoal }; drawResult(); return; }
      if (e.target.closest("[data-addcard]")) { rb.adding = { kind: "card", team: e.target.closest("[data-addcard]").dataset.addcard }; drawResult(); return; }
      if (e.target.closest("[data-addcancel]")) { rb.adding = null; drawResult(); return; }
      if (e.target.closest("[data-addsave]")) {
        const box = rb.back, ad = rb.adding;
        let pid = box.querySelector("#adP").value, n = box.querySelector("#adN") ? box.querySelector("#adN").value.trim().slice(0, 24) : "";
        if (pid === "__other") pid = "";
        if (!pid && !n && ad.kind === "card") { box.querySelector("#adP").focus(); return; }
        const evType = box.querySelector("#adT").value;
        const ev = { type: evType, team: evType === "og" ? otherSide(f, ad.team) : ad.team, min: Math.max(0, Math.min(130, +box.querySelector("#adM").value || 0)) || null, at: Date.now(),
          ...(pid ? { pid } : {}), ...(n ? { n } : {}) };
        const as = box.querySelector("#adA") ? box.querySelector("#adA").value : "";
        if (as && as !== pid && ev.type !== "og") ev.assist = as;
        rb.adding = null;
        const patch = { [`events/${newId()}`]: ev };
        const s0 = scoreOf(f), forHome = evSide(f, ev) === f.home;
        if (ev.type === "goal" || ev.type === "pen" || ev.type === "og") {
          patch.hs = Math.max(s0.h, s0.eh + (forHome ? 1 : 0));
          patch.as = Math.max(s0.a, s0.ea + (forHome ? 0 : 1));
        }
        if ((f.status || "scheduled") === "scheduled") patch.status = "live";             // the first goal starts the match
        await save(f.id, patch);
        return;
      }
      const rm = e.target.closest("[data-rmev]");
      if (rm) { if (await confirmBox("Remove this?", "It comes off the match and the stats.", { ok: "Remove", danger: true, icon: "🗑️" })) await save(f.id, { [`events/${rm.dataset.rmev}`]: null }); }
    }
    async function onResultChange(e) {
      const rb = resultBox; if (!rb) return;
      const f = fixtures().find(x => x.id === rb.id);
      if (e.target.id === "adT" && rb.adding && rb.adding.kind === "goal") { const keepM = rb.back.querySelector("#adM").value; rb.adding.type = e.target.value; rb.adding.pid = ""; drawResult(); rb.back.querySelector("#adM").value = keepM; return; }
      if (e.target.id === "adP") { rb.adding.pid = e.target.value; const keepT = rb.back.querySelector("#adT").value, keepM = rb.back.querySelector("#adM").value; drawResult(); rb.back.querySelector("#adT").value = keepT; rb.back.querySelector("#adM").value = keepM; return; }
      if (e.target.id === "rsMotm") await save(f.id, { motm: e.target.value || null });
      if (/^ro_/.test(e.target.id) && !offLocked(f)) await save(f.id, { officials: readOfficials(rb.back, "ro_") });
      if (e.target.id === "pnH" || e.target.id === "pnA") {
        const h = rb.back.querySelector("#pnH").value, a = rb.back.querySelector("#pnA").value;
        await save(f.id, { pens: h === "" && a === "" ? (f.pens && f.pens.win ? { win: f.pens.win } : null) : { h: h === "" ? null : +h, a: a === "" ? null : +a, ...(f.pens && f.pens.win ? { win: f.pens.win } : {}) } });
      }
    }

    async function deleteMatch(id) {
      const f = fixtures().find(x => x.id === id);
      if (!f) return;
      if (!await confirmBox("Delete this match?", `${team(f.home).name} vs ${team(f.away).name}${hasScore(f) ? " and its result" : ""} will be removed.`, { ok: "Delete", danger: true, icon: "🗑️" })) return;
      await set(fRef(id), null);
    }

    // ============================================================
    // Events
    // ============================================================
    root.addEventListener("click", e => {
      const t = e.target.closest("[data-tab]");
      if (t) { tab = t.dataset.tab; history.replaceState(null, "", location.pathname + location.search + "#" + tab); render(); scrollTo({ top: Math.min(scrollY, root.querySelector(".hub-tabs").offsetTop - 10), behavior: "smooth" }); return; }
      const fl = e.target.closest("[data-filter]"); if (fl) { matchFilter = fl.dataset.filter; render(); return; }
      const act = e.target.closest("[data-act]");
      if (act) {
        const a = act.dataset.act;
        if (a === "manage-gen") { manage = true; render(); return generate(); }
        if (a === "add") return editMatch(null);
        if (a === "gen") return generate();
        if (a === "settings") return settingsForm();
      }
      const r = e.target.closest("[data-result]"); if (r) return openResult(r.dataset.result);
      const ed = e.target.closest("[data-edit]"); if (ed) return editMatch(ed.dataset.edit);
      const del = e.target.closest("[data-del]"); if (del) return deleteMatch(del.dataset.del);
      const tm = e.target.closest("[data-team]"); if (tm) { openTeam = openTeam === tm.dataset.team ? null : tm.dataset.team; render(); return; }
      const m = e.target.closest("[data-match]"); if (m) return openMatch(m.dataset.match);
    });
    root.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-match]")) openMatch(e.target.dataset.match); });
    root.addEventListener("change", e => { if (e.target.id === "manageTgl") { manage = e.target.checked; render(); } });
    addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some(x => x[0] === h) && h !== tab) { tab = h; render(); } });

    // ============================================================
    // Start
    // ============================================================
    // ---------- share: a short, readable link ----------
    async function shareHub() {
      const staff = isStaff(), cur = H().slug || "";
      await form("Share the hub", `
        <p class="hint" style="margin-top:0">Anyone with this link sees fixtures, results, the table and stats, live.</p>
        <div class="share-link"><b id="shLink">${safe(shortLink().replace(/^https?:\/\//, ""))}</b><button class="btn btn-sun btn-sm" id="shCopy">Copy</button></div>
        <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">
          <a class="btn btn-light btn-sm" id="shWa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(`${A.title || "Tournament"} · fixtures, results & table: ${shortLink()}`)}">WhatsApp</a>
          ${navigator.share ? `<button class="btn btn-light btn-sm" id="shNative">More…</button>` : ""}
        </div>
        ${staff ? `<div class="share-slug">
            <label class="label" for="shSlug">Short name for the link</label>
            <div class="slug-row"><span>${safe(location.host)}/t/</span><input class="input" id="shSlug" maxlength="30" value="${safe(cur || slugify((A.title || "").split(/\s+/)[0]) || "")}" placeholder="e.g. kafco"><button class="btn btn-dark btn-sm" id="shSave">${cur ? "Change" : "Save"}</button></div>
            <p class="hint" id="shMsg">Letters, numbers and dashes. The old long link keeps working too.</p></div>` : ""}
        <div class="dlg-actions"><button class="btn btn-light" data-cancel>Close</button></div>`,
        (back, close) => {
          const msg = (t, bad) => { const m = back.querySelector("#shMsg"); if (m) { m.textContent = t; m.className = "hint" + (bad ? " err" : ""); } };
          const refresh = () => {
            back.querySelector("#shLink").textContent = shortLink().replace(/^https?:\/\//, "");
            back.querySelector("#shWa").href = `https://wa.me/?text=${encodeURIComponent(`${A.title || "Tournament"} · fixtures, results & table: ${shortLink()}`)}`;
          };
          back.querySelector("#shCopy").onclick = async () => { await copyText(shortLink()); back.querySelector("#shCopy").textContent = "Copied ✓"; };
          back.querySelector("#shNative")?.addEventListener("click", () => navigator.share({ title: A.title || "Tournament hub", url: shortLink() }).catch(() => {}));
          back.querySelector("#shSlug")?.addEventListener("input", e => { e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, ""); });
          back.querySelector("#shSave")?.addEventListener("click", async () => {
            const slug = back.querySelector("#shSlug").value.replace(/^-+|-+$/g, "");
            if (!/^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$/.test(slug)) return msg("Use 3 to 30 letters, numbers or dashes.", true);
            if (slug === cur) return msg("That's already your link.");
            try {
              const taken = await get(ref(db, `hubSlugs/${slug}`));
              if (taken.exists() && taken.val().code !== code) return msg(`"${slug}" is taken. Try another.`, true);
              const ch = { [`hubSlugs/${slug}`]: { code, at: Date.now() }, [`auctions/${code}/hub/slug`]: slug };
              if (H().slug && H().slug !== slug) ch[`hubSlugs/${H().slug}`] = null;     // free the old name
              await update(ref(db), ch);
              msg("Saved. Share the new link above.");
              setTimeout(refresh, 300);
            } catch (e) { msg("Couldn't save that name. " + (e.message || ""), true); }
          });
        });
    }

    async function refreshBanners() {
      const key = JSON.stringify(A.banners || {});
      if (key === bannerKey) return;
      bannerKey = key;
      const srcs = await loadBanners(code, A.banners, bannerCache);
      setPageBackground(srcs[0]);
      document.documentElement.style.setProperty("--hub-hero", srcs[0] ? `url("${srcs[0]}")` : "none");
    }
    async function start() {
      if (!code && slugFromUrl) {
        user = (await currentUser()) || (await ensureGuest());
        try { const s = await get(ref(db, `hubSlugs/${slugFromUrl.toLowerCase()}`)); if (s.exists()) code = s.val().code; } catch (e) {}
        if (!code) { root.innerHTML = `<div class="card hub-locked"><h1 class="title">Link not found</h1><p class="lead">No tournament uses the name "${safe(slugFromUrl)}". Check the link.</p></div>`; return; }
      }
      if (!code) { root.innerHTML = `<div class="card hub-locked"><h1 class="title">No tournament chosen</h1><p class="lead">Open the hub from an auction's results.</p></div>`; return; }
      user = (await currentUser()) || (await ensureGuest());
      onValue(ref(db, `auctions/${code}`), async snap => {
        A = snap.val();
        if (!A) { root.innerHTML = `<div class="card hub-locked"><h1 class="title">Tournament not found</h1><p class="lead">Check the link and try again.</p></div>`; return; }
        applySportTheme((A.settings && A.settings.sport) || "football");
        render();
        document.querySelectorAll(".modal-back.hub-live-modal").forEach(b => b._redraw && b._redraw());
        drawResult();
        refreshTourLogo(code, A);
        refreshBanners();
        if (await loadTeamLogos(code, A.teams, logos)) render();
      }, err => { root.innerHTML = `<div class="card hub-locked"><h1 class="title">Can't open this hub</h1><p class="lead">${safe(err.message || "")}</p></div>`; });
    }
    start();
  </script>
</body>
</html>
